정령_사랑이_일반", "overlay": "assets/characters/13.webp", "photo": "compiler_photos/12_13_a.jpg"}, {"index": 13, "name": "14_노진1리 경로당", "key": "14", "character": "14_노진리정령_가루_전설", "overlay": "assets/characters/14.webp", "photo": "compiler_photos/13_14_a.jpg"}, {"index": 14, "name": "15_이화3리 마을회관", "key": "15", "character": "15_이화리정령_이화이_희귀", "overlay": "assets/characters/15.webp", "photo": "compiler_photos/14_15_a.jpg"}, {"index": 15, "name": "16_화산2리 마을회관_배미", "key": "16", "character": "16_화산리정령_배미_전설", "overlay": "assets/characters/16.webp", "photo": "compiler_photos/15_16_a.jpg"}, {"index": 16, "name": "17_석천1리 마을회관_낭깨", "key": "17", "character": "17_석천리 정령_낭깨_일반", "overlay": "assets/characters/17.webp", "photo": "compiler_photos/16_17_a.jpg"}, {"index": 17, "name": "18_매향리 평화 생태공원", "key": "18", "character": "18_매향리정령_매향이_일반", "overlay": "assets/characters/18.webp", "photo": "compiler_photos/17_18_a.jpg"}, {"index": 18, "name": "19_덕다2리 마을회관(구래마을)", "key": "19", "character": "19_덕다2리정령_더부기_전설", "overlay": "assets/characters/19.webp", "photo": "compiler_photos/18_19_a.jpg"}, {"index": 19, "name": "20_1_독정1리(독쟁이)", "key": "20_1", "character": "20_1_독정1리_독이_희귀", "overlay": "assets/characters/20_1.webp", "photo": "compiler_photos/19_20_1_a.jpg"}, {"index": 20, "name": "20_1_독정1리(한천)", "key": "20_1", "character": "20_1_독정1리_독이_희귀", "overlay": "assets/characters/20_1.webp", "photo": "compiler_photos/20_20_1_b.jpg"}, {"index": 21, "name": "20_2_독정2리(감드러지) 정류장", "key": "20_2", "character": "20_2_독정2리정령_버선마리", "overlay": "assets/characters/20_2.webp", "photo": "compiler_photos/21_20_2_a.jpg"}, {"index": 22, "name": "20_3_독정3리(감드러지)", "key": "20_3", "character": "20_3_독정3리정령_감드러지", "overlay": "assets/characters/20_3.webp", "photo": "compiler_photos/22_20_3_a.jpg"}, {"index": 23, "name": "20_3_독정3리(거묵골)", "key": "20_3", "character": "20_3_독정3리정령_감드러지", "overlay": "assets/characters/20_3.webp", "photo": "compiler_photos/23_20_3_b.jpg"}, {"index": 24, "name": "21_장안8리(온수골_장명초)", "key": "21", "character": "21_장안리정령_온이", "overlay": "assets/characters/21.webp", "photo": "compiler_photos/24_21_a.jpg"}];
const $=(x)=>document.getElementById(x);
const found=new Set(); // 이 페이지가 열린 동안의 진행 상황만 표시
let active=null; let system=null;
function update(){ $('count').textContent=`${found.size}/${PLACES.length}`; $('meterFill').style.width=`${100*found.size/PLACES.length}%`; }
function showDetail(i){const p=PLACES[i];active=i;found.add(i);update();$('detailTitle').textContent=`${i+1}번 · ${p.character}`;$('detailImage').src=p.overlay;$('detailDesc').textContent=`장소: ${p.name}`;$('detail').classList.remove('hidden');}
function makeCollection(){const g=$('collectionGrid');g.replaceChildren();for(const p of PLACES){const b=document.createElement('button');b.type='button';b.className='thumb'+(found.has(p.index)?' done':'');b.textContent=found.has(p.index)?`${p.index+1} ✓`:`${p.index+1} 🔒`;b.onclick=()=>{if(found.has(p.index)){ $('collection').classList.add('hidden');showDetail(p.index); }};g.append(b);}}
const scene=$('arScene');
let isStarting=false;
function waitForScene(maxMs=20000){
  if(scene.hasLoaded && scene.systems && scene.systems['mindar-image-system']) return Promise.resolve(scene.systems['mindar-image-system']);
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{scene.removeEventListener('loaded',ready);reject(new Error('AR 장면 초기화 시간 초과: 캐릭터 파일이나 스크립트를 확인하세요.'));},maxMs);
    function ready(){clearTimeout(timer);scene.removeEventListener('loaded',ready);const sys=scene.systems?.['mindar-image-system'];sys?resolve(sys):reject(new Error('MindAR 라이브러리 초기화 실패'));}
    scene.addEventListener('loaded',ready);
    if(scene.hasLoaded) ready();
  });
}
async function checkFiles(){
  const response=await fetch('./targets.mind',{cache:'no-store'});
  if(!response.ok) throw new Error(`targets.mind 응답 오류: HTTP ${response.status}`);
  const size=Number(response.headers.get('content-length')||0);
  if(size>0 && size<100) throw new Error('targets.mind 파일이 너무 작습니다. 컴파일 파일을 확인하세요.');
}
$('begin').addEventListener('click',async()=>{
  if(isStarting)return;
  isStarting=true;const b=$('begin');b.disabled=true;
  const msg=$('startMessage');msg.textContent='파일 및 카메라 환경을 확인하는 중...';
  try{
    if(!window.isSecureContext) throw new Error('HTTPS 주소에서 접속해야 합니다.');
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('이 브라우저는 카메라 접근을 지원하지 않습니다. Chrome 또는 Safari에서 직접 열어주세요.');
    await checkFiles();
    msg.textContent='AR 장면 로딩 중...';
    system=await waitForScene();
    msg.textContent='카메라 권한 요청 및 인식 데이터 로딩 중... (25장이라 시간이 걸릴 수 있어요)';
    await system.start();
    $('start').classList.add('hidden');
  }catch(e){
    console.error('AR 시작 실패:',e);
    const raw=e?.message||String(e);
    let tip='';
    if(e?.name==='NotAllowedError') tip=' 카메라 권한이 차단되어 있습니다. 주소창의 사이트 권한에서 허용해주세요.';
    else if(e?.name==='NotFoundError')tip=' 카메라 장치를 찾지 못했습니다.';
    else if(e?.name==='NotReadableError')tip=' 다른 앱이 카메라를 사용 중일 수 있습니다.';
    msg.textContent=`시작 실패: ${raw}${tip}`;
  }finally{isStarting=false;b.disabled=false;}
});
$('arScene').addEventListener('loaded',()=>{system=$('arScene').systems['mindar-image-system'];});
$('arScene').addEventListener('arReady',()=>{$('start').classList.add('hidden');$('status').textContent='카메라 실행 중 · 장소 사진을 비춰주세요.';});
$('arScene').addEventListener('arError',(event)=>{$('startMessage').textContent='AR 실행 오류: '+(event?.detail?.message||'카메라/타깃 로딩 실패. targets.mind와 권한 확인');$('begin').disabled=false;});
for(const p of PLACES){const t=$('t'+p.index);t.addEventListener('targetFound',()=>{active=p.index;found.add(p.index);update();$('status').textContent=`${p.index+1}번 장소 인식: ${p.name}`;$('bottom').textContent=`${p.character} 등장!`;$('openCard').classList.add('show');});t.addEventListener('targetLost',()=>{$('openCard').classList.remove('show');$('bottom').textContent='다음 장소를 카메라로 찾아보세요.';});$('plane'+p.index).addEventListener('click',()=>showDetail(p.index));}
$('openCard').addEventListener('click',()=>{if(active!==null)showDetail(active);});
$('closeDetail').addEventListener('click',()=>{$('detail').classList.add('hidden');});
$('viewCollection').addEventListener('click',()=>{makeCollection();$('collection').classList.remove('hidden');});
$('closeCollection').addEventListener('click',()=>{$('collection').classList.add('hidden');});
$('showList').addEventListener('click',()=>{const box=$('photoList');box.classList.toggle('hidden');box.innerHTML=PLACES.map(p=>`${p.index+1}. ${p.name} → ${p.character}`).join('<br>');});
update();
</script></body></html>
